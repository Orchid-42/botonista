<title>Botonista Unboxing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: one CSS-3D wooden chest centred over a floodlit night backdrop; team chips and caption underneath */
:root{
  --night:#060c20; --night2:#0d1838; --ink:#eef2fc; --muted:#8f9bbd; --line:rgba(160,180,230,.18);
  --gold:#ffd23f; --brass:#7a5a2e; --brass2:#3e2b13;
  --display:"Geist", "Inter", system-ui, sans-serif; --mono:"Geist Mono", ui-monospace, monospace;
  --W:380px; --D:250px; --H:82px; --L:28px; --t:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 36%,var(--night2),var(--night) 70%);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;
  display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
header p{margin:0;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stagewrap{position:relative;width:min(620px,100%);height:clamp(470px,70vh,600px);display:grid;place-items:center}
#fx{position:absolute;left:-30%;top:-20%;width:160%;height:140%;pointer-events:none;z-index:6}
.fit{transform:scale(var(--fit,1));transform-origin:50% 55%}
.scene{position:relative;width:var(--W);height:calc(var(--H) + var(--L));perspective:1300px;perspective-origin:50% -20%;cursor:pointer;outline:none}
.scene:focus-visible{outline:2px solid var(--gold);outline-offset:24px;border-radius:8px}
.shadow{position:absolute;left:50%;top:calc(100% + 26px);width:130%;height:70px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(6px)}
.chest{position:absolute;left:50%;top:80%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-26deg)}
.chest.idle{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotateX(-24deg) rotateY(-26deg)}}
.f{position:absolute;left:0;top:0;backface-visibility:hidden;background-size:cover}
.wood{background-image:var(--woodA)}
.woodB{background-image:var(--woodB)}
.shade::after{content:"";position:absolute;inset:0;background:var(--sh,transparent);pointer-events:none}
.f.wood::before,.f.woodB::before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(110,70,30,.35),inset 0 0 14px rgba(90,55,15,.18);background:linear-gradient(180deg,rgba(255,250,235,.10),transparent 18%,transparent 82%,rgba(80,45,10,.10))}
.lid{position:absolute;left:0;top:0;transform-style:preserve-3d}
.inlay{position:absolute;left:0;right:0;pointer-events:none;opacity:.72;mix-blend-mode:multiply}
.medal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;opacity:.7;pointer-events:none}
.latch{position:absolute;border-radius:2px;
  background:radial-gradient(circle at 50% 22%,#6b5326 0 1.1px,#f3dfa6 1.4px 1.9px,transparent 2.2px),radial-gradient(circle at 50% 78%,#6b5326 0 1.1px,#f3dfa6 1.4px 1.9px,transparent 2.2px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 2px),linear-gradient(90deg,#b8954f,#e6cd8c 35%,#f5e3ae 50%,#d6b46b 70%,#a9843f);
  box-shadow:inset 0 0 0 .6px rgba(90,62,20,.7),inset 0 1px 0 rgba(255,250,225,.7),1px 2px 3px rgba(40,20,0,.45)}
.teambox{position:absolute;left:0;top:0;transform-style:preserve-3d;backface-visibility:hidden}
.teambox img{display:block;width:100%;height:100%;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.inglow{position:absolute;left:0;top:0;pointer-events:none;background:radial-gradient(closest-side,rgba(255,236,170,.95),rgba(255,210,63,.35) 55%,transparent);opacity:0}
.hint{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);animation:pulse 1.8s ease-in-out infinite;margin-top:-6px}
@keyframes pulse{50%{opacity:.4}}
.caption{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:92px}
.caption .eyebrow{font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.caption .team{font-size:clamp(26px,6vw,40px);font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-wrap:balance}
.caption .why{font-size:13px;color:var(--muted)}
.caption.off{visibility:hidden}
.picker{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:620px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:500 13px var(--display);cursor:pointer}
.chip i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.again:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.again{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--display);cursor:pointer}
.note{font-size:12px;color:var(--muted);max-width:520px;text-align:center;line-height:1.5;margin:0}
</style>

<header><h1>Edição especial</h1><p>prévia da animação</p></header>
<div class="stagewrap" id="wrap">
  <canvas id="fx"></canvas>
  <div class="fit" id="fit">
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Abrir a caixa de madeira">
      <div class="shadow"></div>
      <div class="chest idle" id="chest"></div>
    </div>
  </div>
</div>
<div class="hint" id="hint">Toque para abrir</div>
<div class="caption off" id="cap" aria-live="polite"><span class="eyebrow">Edição especial desbloqueada</span><span class="team" id="capTeam"></span><span class="why" id="capWhy"></span></div>
<div class="picker" id="picker"></div>
<button class="again" id="again" type="button">Fechar a caixa</button>
<p class="note">Prévia com a caixa do uniforme normal. No jogo, a caixa especial de cada time usa a arte exportada do PSD.</p>

  lid=document.createElement('div');lid.className='lid';lid.style.transform=lidT(0);chest.appendChild(lid);
  const lidTop=face(lid,W,D,`translateY(${-L}px) translateZ(${D/2}px) rotateX(90deg)`,'wood','linear-gradient(160deg,rgba(255,245,225,.20),rgba(80,40,0,.06))');
  face(lid,W,D,`translateY(0px) translateZ(${D/2}px) rotateX(-90deg)`,'woodB','radial-gradient(ellipse,rgba(70,35,0,.05),rgba(70,35,0,.30))');
  const lidFront=face(lid,W,L,`translateY(${-L/2}px) translateZ(${D}px)`,'wood','linear-gradient(180deg,rgba(255,240,220,.10),rgba(80,40,0,.10) 80%,rgba(60,30,0,.28))');
  face(lid,W,L,`translateY(${-L/2}px) rotateY(180deg)`,'wood','rgba(60,30,0,.25)');
  const lidL=face(lid,D,L,`translateY(${-L/2}px) translateZ(${D/2}px) rotateY(-90deg) translateZ(${W/2}px)`,'woodB','rgba(60,30,0,.30)');
  const lidR=face(lid,D,L,`translateY(${-L/2}px) translateZ(${D/2}px) rotateY(90deg) translateZ(${W/2}px)`,'woodB','rgba(60,30,0,.24)');
  accent([lidFront,lidL,lidR],lidTop);
  // the hasp on the lid front, folds up before the lid opens
  hasp=document.createElement('div');hasp.className='latch';hasp.style.cssText+=`width:12px;height:22px;transform:${haspT(0)}`;lid.appendChild(hasp)}
// a thin two-tone inlay round the lid and a small round inlay on top, in the team's colours
function accent(sides,top){const T=TEAMS[cur],a=lum(T.dome)>.85?T.ring:T.dome,b=lum(T.dome)>.85?T.dome:T.ring;
  for(const f of sides){const d=document.createElement('div');d.className='inlay';d.style.cssText+=`top:40%;height:5px;background:linear-gradient(180deg,${a} 0 50%,${b} 50% 100%);box-shadow:0 0 0 .5px rgba(60,30,0,.25)`;f.appendChild(d)}}
const lidT=a=>`translateY(${-H/2}px) translateZ(${-D/2}px) rotateX(${a}deg)`;
const haspT=a=>`translate(-50%,0) translateZ(${D+1.6}px) translateY(${-L*.42}px)`;
const tbStart=()=>`translate(-50%,-50%) translateX(0px) translateY(${H/2-t-3}px) translateZ(0px) rotateY(0deg) rotateX(90deg) scale(1)`;
const tbEnd=()=>`translate(-50%,-50%) translateX(${D*.12}px) translateY(${-H*2.4}px) translateZ(${D*.7}px) rotateY(14deg) rotateX(52deg) scale(.96)`;

function reset(){opened=false;busy=false;document.getAnimations().forEach(a=>a.cancel());build();chest.classList.add('idle');$('#cap').classList.add('off');$('#hint').hidden=false;
  scene.setAttribute('aria-label','Abrir a caixa de madeira');parts=[];cx.clearRect(0,0,cv.width,cv.height)}

function open(){if(opened||busy)return;opened=busy=true;chest.classList.remove('idle');$('#hint').hidden=true;
  const T=TEAMS[cur];$('#capTeam').textContent=T.pt;$('#capWhy').textContent=WHY[cur]||'';
  const ease='cubic-bezier(.2,.75,.25,1)',F={fill:'forwards'};
  if(RM){chest.style.transform='rotateX(-50deg) rotateY(-14deg)';lid.style.transform=lidT(108);tbox.style.transform=tbEnd();glow.style.opacity=.8;showCap(200);return}
  // nudge, flip the hasp, then the lid swings back on its hinge
  chest.animate([{transform:'rotateX(-24deg) rotateY(-26deg)'},{transform:'translateY(3px) rotateX(-24deg) rotateY(-26deg) rotateZ(-1deg)'},{transform:'translateY(-2px) rotateX(-24deg) rotateY(-26deg) rotateZ(1deg)'},{transform:'rotateX(-24deg) rotateY(-26deg)'}],{duration:320});
  chest.animate([{transform:'rotateX(-24deg) rotateY(-26deg)'},{transform:'rotateX(-50deg) rotateY(-14deg)'}],{duration:1400,delay:420,easing:'cubic-bezier(.4,0,.2,1)',...F});
  lid.animate([{transform:lidT(0)},{transform:lidT(8),offset:.12},{transform:lidT(116),offset:.78},{transform:lidT(104),offset:.9},{transform:lidT(108)}],{duration:1150,delay:520,easing:'cubic-bezier(.35,0,.25,1)',...F});
  glow.animate([{opacity:0},{opacity:1,offset:.45},{opacity:.65}],{duration:1200,delay:760,...F});
  // the team box rises out of the chest and turns to face you
  tbox.animate([{transform:tbStart()},{transform:`translate(-50%,-50%) translateX(0px) translateY(${-H*1.1}px) translateZ(${D*.1}px) rotateY(4deg) rotateX(84deg) scale(1.01)`,offset:.4},{transform:tbEnd()}],{duration:1100,delay:1500,easing:ease,...F});
  setTimeout(()=>burst(T),2150);
  showCap(2350)}
function showCap(ms){setTimeout(()=>{const c=$('#cap');c.classList.remove('off');c.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:520,easing:'ease-out'});busy=false;scene.setAttribute('aria-label','Caixa aberta')},ms)}

// confetti in the team's colours, from where the team box lands
let parts=[],raf=0;
function burst(T){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;
  const b=tbox.getBoundingClientRect(),ox=(b.left+b.width/2-r.left)*dpr,oy=(b.top+b.height*.45-r.top)*dpr;
  const cols=[T.dome,T.ring,T.dome,T.ring,lum(T.dome)>.85||lum(T.ring)>.85?'#d9dde6':'#ffffff'];
  for(let i=0;i<200;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3,s=(7+Math.random()*13)*dpr;
    parts.push({x:ox+(Math.random()-.5)*b.width*.6*dpr,y:oy+(Math.random()-.5)*30*dpr,vx:Math.cos(a)*s*(.6+Math.random()*.7),vy:Math.sin(a)*s,w:(5+Math.random()*6)*dpr,h:(9+Math.random()*9)*dpr,
      rot:Math.random()*6.3,vr:(Math.random()-.5)*.35,fl:Math.random()*6.3,vf:.12+Math.random()*.2,c:cols[i%cols.length],round:Math.random()<.22,life:0})}
  cancelAnimationFrame(raf);let last=performance.now();
  const tick=tt=>{const dt=Math.min(2,(tt-last)/16.7);last=tt;cx.clearRect(0,0,cv.width,cv.height);
    for(const p of parts){p.life+=dt;p.vy+=.32*dpr*dt;p.vx*=Math.pow(.985,dt);p.vy*=Math.pow(.985,dt);p.x+=(p.vx+Math.sin(p.fl)*1.2*dpr)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.fl+=p.vf*dt;
      const al=Math.max(0,Math.min(1,(240-p.life)/60));if(al<=0)continue;cx.save();cx.globalAlpha=al;cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.fl));
      cx.fillStyle=p.c;if(p.round){cx.beginPath();cx.arc(0,0,p.w*.55,0,6.3);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      if(lum(p.c)>.9){cx.strokeStyle='rgba(0,0,0,.18)';cx.lineWidth=dpr;cx.strokeRect(-p.w/2,-p.h/2,p.w,p.h)}cx.restore()}
    parts=parts.filter(p=>p.life<240&&p.y<cv.height+40);if(parts.length)raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick)}

// fit the scene on narrow screens
function fit(){const w=$('#wrap').clientWidth;$('#fit').style.setProperty('--fit',Math.min(1,w/560))}
addEventListener('resize',fit);fit();
const pk=$('#picker');for(const k of Object.keys(TEAMS)){const b=document.createElement('button');b.className='chip';b.type='button';b.id='chip-'+k;
  const tm=TEAMS[k];b.innerHTML=`<i style="background:linear-gradient(135deg,${tm.dome} 50%,${tm.ring} 50%)"></i>${tm.pt}`;b.setAttribute('aria-pressed',k===cur);
  b.onclick=()=>{cur=k;pk.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.id==='chip-'+k));reset()};pk.appendChild(b)}
scene.onclick=open;scene.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
$('#again').onclick=reset;
reset();
</script>
