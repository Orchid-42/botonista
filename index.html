<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Botonista</title>
<meta name="description" content="Futebol de botão na mesa: Copa do Mundo e Copa do Brasil, palhetas colecionáveis.">
<meta name="theme-color" content="#08112a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Botonista">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#08112a;-webkit-text-size-adjust:100%}body{height:100%;margin:0;overscroll-behavior:none}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: single-screen app, night blue with yellow accents and hairline rules. Home and bracket are sized to the viewport and never scroll; the match is scoreboard, table, control strip. */
:root{
  --bg:#08112a; --panel:#0c1734; --soft:rgba(255,255,255,.035); --ink:#eef2fb; --muted:#7f90b8; --line:rgba(150,175,235,.16); --line2:rgba(150,175,235,.28);
  --board:#050c20; --board-ink:#eef2fb; --board-muted:#7f90b8;
  --accent:#ffd23f; --accent-ink:#1a1400; --stage:#060e24;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.fit{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);max-width:1040px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(10px,2.4vh,24px);overflow:auto}
h1,h2,h3{font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin:0}
.val{color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:clamp(8px,1.6vh,14px);border-bottom:1px solid var(--line)}
.brand{font-size:clamp(28px,5.4vh,48px);line-height:1;font-weight:700;letter-spacing:-.05em;color:var(--accent)}
.brand.small{font-size:22px}
.tools{display:flex;gap:6px;align-items:center}
.tools .btn{padding:7px 12px;font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--ink);display:grid;place-items:center;font-weight:500;font-size:15px;padding:0}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:17px;height:17px;stroke-width:1.5}

.homegrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:clamp(12px,2.2vh,22px) 28px;align-content:start}
.homegrid .teamsBlock{grid-row:1/3}
@media (max-width:760px){.homegrid{grid-template-columns:minmax(0,1fr);grid-template-rows:none}.homegrid .teamsBlock{grid-row:auto}}
.block{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);min-width:0}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cupSeg button{padding-block:clamp(4px,.8vh,7px)}
@media (max-width:760px){.skins{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:64px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.skins::-webkit-scrollbar{display:none}}
@media (max-height:820px){.team{padding-block:clamp(4px,.75vh,9px)}.skin{padding-block:clamp(3px,.6vh,8px)}.skin canvas{width:clamp(24px,4.2vh,40px);height:clamp(24px,4.2vh,40px)}.block{gap:clamp(5px,1vh,10px)}.homegrid{row-gap:clamp(8px,1.6vh,22px)}}
.hint{font-size:12px;color:var(--muted);margin:0;min-height:1.4em}
.aimrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.aimrow .hint{min-height:0}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line2)}
.pips i.on{background:var(--accent)}

.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.team{display:flex;align-items:center;gap:8px;padding:clamp(5px,1vh,9px) 8px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;text-align:left;min-width:0}
.team:hover{border-color:var(--line2)}
.team[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.team b{font-size:13px;font-weight:600;font-family:var(--mono);letter-spacing:.02em}
.team small{display:none;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){.team small{display:block}.team .tx{min-width:0}}
.flag{flex:none;display:inline-block;width:24px;height:16px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
.flag svg{display:block;width:100%;height:100%}
.mrow .flag{width:18px;height:12px}
.board .flag{width:28px;height:19px}
.disc{flex:none;width:18px;height:18px;border-radius:50%;background:var(--dome);box-shadow:0 0 0 1.5px var(--ring)}

.skins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;padding:clamp(4px,.9vh,8px) 2px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;min-width:0}
.skin canvas{width:clamp(26px,4.6vh,40px);height:clamp(26px,4.6vh,40px)}
.skin b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.skin[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.skin.locked canvas{opacity:.22;filter:grayscale(1)}
.skin.locked b{color:var(--muted)}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1;padding:clamp(5px,1vh,8px) 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.btn{border:1px solid transparent;border-radius:6px;padding:9px 16px;font-weight:600;font-size:14px;background:transparent;color:var(--ink);white-space:nowrap}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line2)}
.btn.big{padding:clamp(10px,1.6vh,13px) 18px;font-size:15px}
.btn.icon{padding:9px 12px;min-width:42px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.resume h2{font-size:16px}

.acctb{position:relative}
.acctb.in::after{content:"";position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.acctb.in.err::after{background:#ff5a3d}
.authf{display:flex;flex-direction:column;gap:10px}
.authf input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:11px 12px;outline:none}
.authf input:focus{border-color:var(--accent)}
.gbox{min-height:44px;display:flex;justify-content:center;align-items:center;color-scheme:light;overflow:hidden;border-radius:999px}
.gbox>.btn{flex:1;background:#fff;color:#1f1f1f}
.aor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.aor::before,.aor::after{content:"";flex:1;height:1px;background:var(--line)}
#amsg{min-height:1.2em;margin:0;font-size:13px;color:var(--muted)}#amsg.err{color:#ff8a70}#amsg.ok{color:var(--accent)}
.lnk2{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;align-self:center;padding:4px}
.small{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,7,20,.72);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px;width:min(100%,460px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:pop .25s cubic-bezier(.2,1.3,.4,1)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:20px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.rules li{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.rules li b{font-weight:500;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}

.nextbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.nextbar h2{font-size:clamp(18px,3.4vh,28px)}
.bracket{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.4vw,14px)}
.round{display:flex;flex-direction:column;gap:clamp(2px,.7vh,8px);justify-content:space-around;min-width:0;min-height:0}
.round .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.match.mine{border-color:var(--accent)}
.mrow{display:flex;align-items:center;gap:6px;padding:clamp(1px,.45vh,5px) 7px;min-width:0;line-height:1.3}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .disc{width:11px;height:11px;box-shadow:0 0 0 1px var(--ring)}
.mrow span.n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.mrow .long{display:none}
@media (min-width:760px){.mrow .long{display:inline}.mrow .short{display:none}}
.mrow.win{color:var(--ink);font-weight:600}
.mrow.lose{color:var(--muted)}
.mrow .sc{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.tbd{color:var(--muted)}
.fresh{color:var(--accent)}

/* match */
.board{background:var(--board);color:var(--board-ink);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;border-bottom:1px solid var(--line2)}
.board .side{display:flex;align-items:center;gap:10px;min-width:0}
.board .away{justify-content:flex-end}
.board .side>div{min-width:0}
.board .side b{font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.board .side small{display:flex;gap:6px;align-items:center;color:var(--board-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.board .away small{justify-content:flex-end}
.board .mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.score{font-family:var(--mono);font-weight:500;font-size:28px;line-height:1;display:flex;gap:12px}
.score .dash{color:var(--board-muted)}
.clock{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.pens{font-family:var(--mono);font-size:12px;color:var(--board-ink);display:flex;flex-direction:column;letter-spacing:.1em}
.poss{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);visibility:hidden}
.poss.on{visibility:visible}
@media (max-width:480px){.board .side b{font-size:14px}.board .flag{display:none}}

.stage{flex:1;min-height:0;position:relative;background:var(--stage);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{touch-action:manipulation}
.playbar{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.08);pointer-events:none}
.playbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:background .2s}
.playbar.low i{background:#ff5a3d}
.playbar span{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--ink);background:rgba(5,12,32,.75);border:1px solid var(--line2);border-radius:99px;padding:2px 9px}
.playbar.low span{color:#ff8a70;border-color:#ff5a3d}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:rgba(5,12,32,.75);color:var(--board-ink);font-size:18px;font-weight:400;line-height:1}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.overlay .card{pointer-events:auto;background:rgba(5,12,32,.92);color:var(--board-ink);padding:18px 26px 20px;border-radius:12px;border:1px solid var(--line2);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:min(88%,400px);display:flex;flex-direction:column;gap:6px;align-items:center;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.overlay h2{font-size:clamp(28px,7vw,42px);line-height:1;font-weight:700;letter-spacing:-.04em;color:var(--accent)}
.overlay p{margin:0;color:var(--board-muted)}
.overlay .row{margin-top:8px;justify-content:center}
#pauseOv{background:rgba(3,7,20,.55);pointer-events:auto}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay .card,.sheet{animation:none}}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 12px;border-top:1px solid var(--line)}
#status{margin:0;flex:1 1 260px;min-width:0;font-size:13.5px;color:var(--muted)}
#status strong{color:var(--ink);font-weight:600}
.champ{font-size:clamp(24px,4.6vh,40px)}
</style>

<div id="app">
  <!-- HOME -->
  <section id="home" class="screen" hidden>
    <div class="fit">
      <header class="topbar"><h1 class="brand">Botonista</h1><div class="tools">
          <button class="iconbtn acctb" data-acct hidden data-ia="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1.2-3.6 4-5.4 7.2-5.4s6 1.8 7.2 5.4"/></svg></button>
          <button class="iconbtn" data-open="help" data-ia="howto">?</button>
          <button class="iconbtn" data-open="settings" data-ia="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div></header>
      <div id="resumeBox" class="resume" hidden>
        <div><p class="label" data-i="inProgress"></p><h2 id="resumeText"></h2></div>
        <div class="row"><button class="btn go" id="resumeBtn" data-i="continue"></button><button class="btn ghost" id="abandonBtn" data-i="startOver"></button></div>
      </div>
      <div class="homegrid">
        <section class="block teamsBlock">
          <div class="seg" id="cupSeg"><button data-v="wc" data-i="cupWC"></button><button data-v="br" data-i="cupBR"></button></div>
          <div class="bhead"><p class="label" id="pickLabel"></p><p class="label val" id="teamName"></p></div>
          <div class="teams" id="teamGrid"></div>
        </section>
        <section class="block">
          <div class="bhead"><p class="label" data-i="yourPalheta"></p><p class="label" id="skinCount"></p></div>
          <div class="skins" id="skinGrid"></div>
          <p class="hint" id="skinHint"></p>
          <div class="aimrow"><p class="label" data-i="aim"></p><span class="pips" id="aimPips"></span><p class="hint" id="aimText"></p></div>
        </section>
        <section class="block">
          <p class="label" data-i="cpuLevel"></p>
          <div class="seg" id="diffSeg"><button data-v="easy" data-i="easy"></button><button data-v="normal" data-i="normal"></button><button data-v="hard" data-i="hard"></button></div>
          <p class="label" data-i="formation"></p>
          <div class="seg" id="formSeg"><button data-v="4-3-3">4-3-3</button><button data-v="4-4-2">4-4-2</button><button data-v="3-5-2">3-5-2</button><button data-v="4-2-3-1">4-2-3-1</button></div>
          <button class="btn go big" id="startBtn" data-i="start"></button>
        </section>
      </div>
    </div>
  </section>

  <!-- BRACKET -->
  <section id="bracket" class="screen" hidden>
    <div class="fit">
      <header class="topbar"><span class="brand small">Botonista</span><div class="tools">
          <button class="btn ghost" id="homeBtn" data-i="mainMenu"></button>
          <button class="iconbtn acctb" data-acct hidden data-ia="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1.2-3.6 4-5.4 7.2-5.4s6 1.8 7.2 5.4"/></svg></button>
          <button class="iconbtn" data-open="help" data-ia="howto">?</button>
          <button class="iconbtn" data-open="settings" data-ia="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div></header>
      <div class="nextbar" id="nextBox"></div>

function drawPalheta(c,x,y,r,skin,rot){
  c.save();c.translate(x,y);c.rotate(rot||0);
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.arc(r*.12,r*.2,r,0,2*PI);c.fill();
  c.beginPath();c.arc(0,0,r,0,2*PI);c.closePath();c.save();c.clip();
  const k=skin.kind;
  c.fillStyle=skin.base;c.fillRect(-r,-r,2*r,2*r);
  if(k==='glass'){c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-r,-r,2*r,r*.8)}
  if(k==='rings'){c.strokeStyle=skin.edge;c.lineWidth=r*.09;for(let i=1;i<5;i++){c.beginPath();c.arc(0,0,r*i/5,0,2*PI);c.stroke()}}
  if(k==='neon'){const g=c.createRadialGradient(0,0,r*.2,0,0,r);g.addColorStop(0,'rgba(54,241,205,0)');g.addColorStop(1,'rgba(54,241,205,.55)');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r)}
  if(k==='carbon'){const s=r/4;for(let i=-4;i<4;i++)for(let j=-4;j<4;j++){c.fillStyle=(i+j)&1?'#2b2e32':'#17191b';c.fillRect(i*s,j*s,s,s)}}
  if(k==='marble'){c.strokeStyle='rgba(120,120,125,.55)';c.lineWidth=r*.06;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-r,-r*.8+i*r*.5);c.bezierCurveTo(-r*.3,-r+i*r*.6,r*.2,-r*.2+i*r*.4,r,-r*.6+i*r*.55);c.stroke()}}
  if(k==='stripes'){c.fillStyle=skin.edge;for(let i=-3;i<3;i++)c.fillRect(i*r*.66,-r,r*.33,2*r)}
  if(k==='wood'){c.strokeStyle='rgba(70,40,15,.45)';c.lineWidth=r*.05;for(let i=0;i<7;i++){c.beginPath();c.ellipse(r*.25,r*.1,r*(.15+i*.18),r*(.1+i*.12),.3,0,2*PI);c.stroke()}}
  if(k==='obsidian'){const g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#2a1f55');g.addColorStop(.5,'#07070b');g.addColorStop(1,'#1b1240');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r)}
  if(k==='gold'){const g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#fff1b0');g.addColorStop(.45,'#d4a017');g.addColorStop(1,'#8a6206');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r)}
  c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.ellipse(-r*.3,-r*.42,r*.55,r*.25,-.4,0,2*PI);c.fill();
  c.restore();
  c.strokeStyle=skin.edge;c.lineWidth=r*.14;c.beginPath();c.arc(0,0,r*.93,0,2*PI);c.stroke();
  c.restore();
}

async function authFresh(){

const stableStr=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);

function mergeSaves(a,b){
  const nw=(a.mod||0)>=(b.mod||0)?a:b,out=JSON.parse(JSON.stringify(nw));out.prefs=out.prefs||{};
  const sa=(a.prefs&&a.prefs.stats)||{},sbb=(b.prefs&&b.prefs.stats)||{},st={};
  for(const k of new Set([...Object.keys(sa),...Object.keys(sbb)]))st[k]=Math.max(sa[k]||0,sbb[k]||0);

}

async function cloudSync(){
  if(!cloudOn()||!AUTH)return;
  if(SYNC.busy){SYNC.again=true;return}
  if(cloudBusy()){SYNC.dirty=true;return}
  clearTimeout(SYNC.timer);SYNC.busy=true;setSync('syncing');
  try{
    if(!AUTH.user||!AUTH.user.id){const u=await sb('/auth/v1/user');AUTH.user=userOf(u);authSave(AUTH)}
    const uid=AUTH.user.id;
    const rows=await sb(`/rest/v1/saves?select=data&game=eq.${CLOUD.game}&user_id=eq.${uid}`);
    if(cloudBusy()){SYNC.dirty=true;setSync('idle');return}
    const here=snapshot(),remote=rows&&rows[0]?rows[0].data:null,merged=remote?mergeSaves(here,remote):here;
    if(stableStr(merged)!==stableStr(here))applySave(merged);
    if(!remote||stableStr(remote)!==stableStr(merged))
      await sb('/rest/v1/saves?on_conflict=user_id,game',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:uid,game:CLOUD.game,data:merged})});
    SYNC.dirty=false;SYNC.at=Date.now();setSync('ok');
  }catch(e){if(e.status===401){authSave(null);setSync('idle')}else setSync('error')}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;setTimeout(cloudSync,500)}}
}

const VOL=.28; // master volume, kept low so the table sounds stay in the background
const Snd={ctx:null,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    let c;try{c=this.ctx=new AC()}catch(e){return}
    this.master=c.createGain();this.master.gain.value=prefs.sound?VOL:0;this.master.connect(c.destination);
    const mk=brown=>{const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;
      for(let i=0;i<n;i++){const w=rand()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b};
    this.white=mk(false);this.brown=mk(true);
    const loop=(buf,type,f,q)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
      const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(this.master);s.start();return {g,fl}};
    this.sBtn=loop(this.brown,'lowpass',380,.8);   // buttons sliding on the wood
    this.sBall=loop(this.white,'bandpass',2400,1.3); // puck hiss
    this.last={};
  },
  setOn(on){prefs.sound=on;save();if(this.master)this.master.gain.setTargetAtTime(on?VOL:0,this.ctx.currentTime,.05)},
  slide(bv,lv){if(!this.ctx)return;const t=this.ctx.currentTime;
    this.sBtn.g.gain.setTargetAtTime(Math.min(.6,bv/240),t,.04);this.sBtn.fl.frequency.setTargetAtTime(220+bv*1.2,t,.05);
    this.sBall.g.gain.setTargetAtTime(Math.min(.16,lv/1700),t,.03);this.sBall.fl.frequency.setTargetAtTime(1600+lv*2.2,t,.05)},
  tension(){},
  hit(type,v){
    const c=this.ctx;if(!c||!prefs.sound)return;v=clamp(v,0,1);if(v<.04)return;
    const now=c.currentTime;if(this.last[type]&&now-this.last[type]<.035)return;this.last[type]=now;
    // [noise band, Q, length, tone Hz, wave, volume]
    const P={clack:[1700,3,.07,720,'triangle',.55],tick:[3200,4,.045,1450,'sine',.4],thud:[240,1,.12,105,'sine',.65],wood:[950,2,.07,430,'sine',.35],
      keeper:[1100,2.5,.08,500,'triangle',.5],post:[2500,14,.3,1950,'sine',.35],net:[850,.7,.3,0,null,.35],land:[1900,2,.05,880,'sine',.25],
      press:[1300,2,.05,560,'sine',.3],flick:[4200,1.4,.035,2400,'triangle',.4]}[type];

    const s=c.createBufferSource();s.buffer=this.white;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;
    const g=c.createGain();g.gain.setValueAtTime(g0,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    s.connect(fl);fl.connect(g);g.connect(this.master);s.start(now,rand()*1.5);s.stop(now+dur+.02);
    if(tone){const o=c.createOscillator();o.type=wave;o.frequency.setValueAtTime(tone,now);if(type==='flick')o.frequency.exponentialRampToValueAtTime(tone*.45,now+dur);
      const og=c.createGain();og.gain.setValueAtTime(g0*.5,now);og.gain.exponentialRampToValueAtTime(.0001,now+dur*.85);o.connect(og);og.connect(this.master);o.start(now);o.stop(now+dur)}
  },
  whistle(long){
    const c=this.ctx;if(!c||!prefs.sound)return;const now=c.currentTime,d=long?.75:.28;
    const g=c.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.06,now+.02);g.gain.setValueAtTime(.06,now+d-.06);g.gain.linearRampToValueAtTime(0,now+d);g.connect(this.master);

    lfo.start(now);lfo.stop(now+d);
  }
};

    for(const b of $(id).children){b.setAttribute('aria-pressed',String(b.dataset.v)===String(prefs[key]));
      b.onclick=()=>{prefs[key]=key==='half'?+b.dataset.v:b.dataset.v;save();renderHome()}}
  const live=T&&!T.done;
  $('#resumeBox').hidden=!live;
  if(live){const t=(CUPS[T.cup||'wc']||NATIONS)[T.user];$('#resumeText').textContent=`${cupName(T.cup)} · ${tn(t)} · ${T.out?tr('eliminated'):tr('rounds')[T.r]}`}
}
$('#startBtn').onclick=()=>{newTournament();show('bracket');renderBracket()};
$('#resumeBtn').onclick=()=>{show('bracket');renderBracket()};
$('#abandonBtn').onclick=()=>{T=null;save();renderHome()};

/* ================= TOURNAMENT ================= */
function newTournament(){
  const ids=TEAMS.map((_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const r0=[];for(let i=0;i<8;i++)r0.push({a:ids[2*i],b:ids[2*i+1]});
  useCup(prefs.cup);
  T={cup:prefs.cup,user:prefs.teams[prefs.cup]||0,diff:prefs.diff,half:prefs.half,form:prefs.form,rounds:[r0,[],[],[]],r:0,out:false,done:false,champ:null};save();
}
const poisson=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=rand()}while(p>L);return k-1};
function simMatch(m){
  const A=TEAMS[m.a],B=TEAMS[m.b];
  m.sa=poisson(Math.max(.3,1.3+(A.r-B.r)*.05));m.sb=poisson(Math.max(.3,1.3+(B.r-A.r)*.05));
  if(m.sa===m.sb){let pa=0,pb=0;const pA=.5+(A.r-B.r)*.02;
    for(let i=0;i<5;i++){pa+=rand()<.75?1:0;pb+=rand()<.75?1:0}
    while(pa===pb){if(rand()<pA)pa++;else pb++}
    m.pa=pa;m.pb=pb;m.w=pa>pb?m.a:m.b}else m.w=m.sa>m.sb?m.a:m.b;
}
function closeRound(){
  const R=T.rounds[T.r];for(const m of R)if(m.w==null)simMatch(m);
  if(T.r===3){T.champ=R[0].w;T.done=true;return}
  const nx=[];for(let i=0;i<R.length;i+=2)nx.push({a:R[i].w,b:R[i+1].w});
  T.rounds[T.r+1]=nx;T.r++;
}
function userMatch(){return T.rounds[T.r].find(m=>(m.a===T.user||m.b===T.user)&&m.w==null)}
function recordUser(res){
  useCup(T.cup||'wc');
  const m=userMatch(); const userIsA=m.a===T.user;
  m.sa=userIsA?res.s[0]:res.s[1]; m.sb=userIsA?res.s[1]:res.s[0];
  if(res.p){m.pa=userIsA?res.p[0]:res.p[1]; m.pb=userIsA?res.p[1]:res.p[0]}
  m.w=res.win?T.user:(userIsA?m.b:m.a);
  if(!res.win){T.out=true;T.outRound=T.r}
  closeRound();
  if(!T.out&&T.r===2&&!T.done)prefs.stats.semis++;
  if(T.done&&T.champ===T.user)prefs.stats.copas++;
  if(T.out)while(!T.done)closeRound();
  save();
}
let freshSkins=[];
function renderBracket(keepFresh){
  useCup(T.cup||'wc');
  const g=$('#bracketGrid');g.innerHTML='';const RN=tr('rounds');
  T.rounds.forEach((R,ri)=>{
    const col=document.createElement('div');col.className='round';col.innerHTML=`<p class="label">${tr('roundsShort')[ri]}</p>`;
    const n=8>>ri;

      if(!m){card.innerHTML=`<div class="mrow tbd"><span class="n">${tr('tbd')}</span></div><div class="mrow tbd"><span class="n">&nbsp;</span></div>`}
      else{ if(m.a===T.user||m.b===T.user)card.classList.add('mine');
        card.innerHTML=[['a','sa','pa'],['b','sb','pb']].map(([k,s,p])=>{const t=TEAMS[m[k]];const cls=m.w==null?'':(m.w===m[k]?'win':'lose');
          const sc=m[s]==null?'':m[s]+(m[p]!=null?` (${m[p]})`:'');
          return `<div class="mrow ${cls}">${flag(t)}<span class="n"><span class="long">${tn(t)}</span><span class="short">${t.c}</span></span><span class="sc">${sc}</span></div>`}).join('')}
      col.appendChild(card)}
    g.appendChild(col)});
  const nb=$('#nextBox'),u=TEAMS[T.user];
  if(!keepFresh)freshSkins=newUnlocks();
  const ul=freshSkins.length?`<p class="label fresh">${tr('newSkin',{x:freshSkins.join(' · ')})}</p>`:'';
  if(T.done&&T.champ===T.user){nb.innerHTML=`<div>${ul}<p class="label">${T.cup==='br'?tr('champsBR'):tr('champs')}</p><h2 class="champ">${tr('lifts',{t:tn(u)})}</h2></div><button class="btn go big" id="againBtn">${tr('newCopa')}</button>`}
  else if(T.out){const c=TEAMS[T.champ];nb.innerHTML=`<div>${ul}<p class="label">${tr('outIn',{round:RN[T.outRound]})}</p><h2>${tr('wonCopa',{t:tn(c)})}</h2></div><button class="btn go" id="againBtn">${tr('newCopa')}</button>`}
  else{const m=userMatch(),opp=TEAMS[m.a===T.user?m.b:m.a];
    nb.innerHTML=`<div>${ul}<p class="label">${cupName(T.cup)} · ${tr('nextMatch',{round:tr('roundsShort')[T.r]})}</p><h2>${tn(u)} × ${tn(opp)}</h2></div><button class="btn go big" id="playBtn">${tr('play')}</button>`;
    $('#playBtn').onclick=()=>startMatch(T.user,m.a===T.user?m.b:m.a)}
  const ag=$('#againBtn');if(ag)ag.onclick=()=>{newTournament();renderBracket()};
}

/* formations: [x share of width, y share of length from the far goal line, shirt number], own half only */
const FORMS={
 '4-3-3':[[.2,.86,2],[.4,.875,3],[.6,.875,4],[.8,.86,6],[.24,.74,5],[.5,.72,8],[.76,.74,10],[.2,.61,7],[.8,.61,11],[.5,.6,9]],
 '4-4-2':[[.2,.86,2],[.4,.875,3],[.6,.875,4],[.8,.86,6],[.14,.73,7],[.38,.75,5],[.62,.75,8],[.86,.73,11],[.38,.61,9],[.62,.61,10]],
 '3-5-2':[[.28,.87,3],[.5,.885,4],[.72,.87,2],[.1,.74,6],[.3,.72,5],[.5,.76,8],[.7,.72,10],[.9,.74,7],[.38,.61,9],[.62,.61,11]],
 '4-2-3-1':[[.2,.86,2],[.4,.875,3],[.6,.875,4],[.8,.86,6],[.38,.785,5],[.62,.785,8],[.18,.67,7],[.5,.68,10],[.82,.67,11],[.5,.6,9]]
};

/* ================= MATCH ================= */
let G=null, matchId=0;
const cv=$('#cv'), ctx=cv.getContext('2d');
let S=3, FIT=3, DPR=1, CW=300, CH=300, stageBg='#071029';
const newBall=(x,y)=>({x,y,vx:0,vy:0,z:0,vz:0,r:BALLR,m:1,isBall:true,live:true});
const homeKeeper=side=>side===0?{x:CX,y:F.b-KH/2-.4,a:0}:{x:CX,y:F.t+KH/2+.4,a:0};
const cpuC=()=>tn(TEAMS[G.teams[1]]);

function startMatch(home,away){
  useCup(T.cup||'wc');
  const base={easy:.3,normal:.58,hard:.82}[T.diff]||.58;
  G={id:++matchId,teams:[home,away],score:[0,0],half:1,halfLen:T.half,clock:T.half,timeUp:false,paused:false,timers:[],
     skill:clamp(base+(TEAMS[away].r-85)*.012,.12,.95),kickFirst:rand()<.5?0:1,
     buttons:[],ball:newBall(CX,CY),keepers:[homeKeeper(0),homeKeeper(1)],kt:[null,null],
     phase:'pause',turn:0,mode:'match',move:null,event:null,announced:false,
     aim:null,kdrag:null,sdrag:null,pan:null,cpuAim:null,pens:null,pkBtn:null,setup:null,sp:null,note:'',
     cam:{x:CX,y:CY,manual:false},hat:0,cpuForm:Object.keys(FORMS)[Math.floor(rand()*4)]};
  $('#hName').textContent=tn(TEAMS[home]);$('#aName').textContent=tn(TEAMS[away]);
  $('#hDisc').outerHTML=flag(TEAMS[home]).replace('class="flag"','class="flag" id="hDisc"');$('#aDisc').outerHTML=flag(TEAMS[away]).replace('class="flag"','class="flag" id="aDisc"');
  $('#pens').hidden=true;$('#pauseOv').hidden=true;$('#btnPause').textContent=tr('pause');
  show('match');hideBanner();
  kickoff(G.kickFirst,true);
}
function later(fn,ms){if(G)G.timers.push({t:ms/1000,fn,id:G.id})}

function setFormation(kicker){
  G.buttons=[];
  for(const side of [0,1])for(const [fx,fy,num] of FORMS[side===0?(T.form||'4-3-3'):G.cpuForm]){
    let x=F.l+fx*FW,y=F.t+fy*FH; if(side===1){x=F.l+(1-fx)*FW;y=F.t+(1-fy)*FH}
    if(num===9&&side===kicker){x=CX;y=CY+(side===0?1:-1)*(BR+BALLR+1.4)}
    G.buttons.push({x,y,vx:0,vy:0,r:BR,m:3,side,num});
  }
  G.keepers=[homeKeeper(0),homeKeeper(1)];G.kt=[null,null];
  G.ball=newBall(CX,CY);
}
function kickoff(side,first){
  setFormation(side);G.lock=null;G.koTouches=0;G.pendingLock=G.mode==='match';G.cam.manual=false;
  const who=side===0?tr('youKick'):tr('cpuKick',{c:cpuC()});
  if(first){Snd.whistle(true);banner(G.half===1?tr('kickoff'):tr('second'),`${tn(TEAMS[G.teams[0]])} × ${cpuC()}`,1400,()=>beginTurn(side,who))}
  else beginTurn(side,who);
}
function setStatus(html){$('#status').innerHTML=html}
function beginTurn(side,msg){
  if(G.lock&&G.lock.side!==side)G.lock=null;
  const koBlock=G.mode==='match'&&(G.koTouches||0)<2;
  G.turn=side;G.announced=false;G.move=null;G.event=null;G.cpuAim=null;G.setup=null;G.cam.manual=false;
  const pre=[msg,G.note].filter(Boolean).join(' ');G.note='';
  if(side===0){G.phase='aim';setStatus(`${pre?pre+' ':''}${tr('yourBall')}${G.lock&&G.lock.side===0?' '+tr('lockNote'):''}${koBlock?' '+tr('koNote'):''}`)}
  else{G.phase='cpuThink';setStatus(`${pre?pre+' ':''}${tr('cpuBall',{c:cpuC()})}`);later(cpuTurn,650+rand()*500)}
  hud();
}
function bodies(){return G.mode==='match'?G.buttons:(G.pkBtn?[G.pkBtn]:[])}

function flick(btn,vx,vy){
  if(G.lock&&btn!==G.lock.b)G.lock=null;
  if(G.pendingLock){G.lock={b:btn,side:btn.side};G.pendingLock=false}
  const pen=!!G.penKick;G.penKick=false;
  Snd.tension(0);Snd.hit('flick',.3+.7*hyp(vx,vy)/VMAX);
  G.move={side:btn.side,btn,announced:G.announced,moverTouched:false,lastTouch:null,foul:false,t:0,pen,ballStart:{x:G.ball.x,y:G.ball.y}};
  G.event=null;G.ball.live=true;btn.vx=vx;btn.vy=vy;G.phase='moving';G.aim=null;G.cpuAim=null;G.cam.manual=false;hud();
}

/* ---------- physics ---------- */
function touchBall(btn){const m=G.move;if(!m||!G.ball.live)return;m.lastTouch=btn.side;if(btn===m.btn)m.moverTouched=true}
function collide(a,b){
  const ball=a.isBall?a:b.isBall?b:null;
  if(ball&&ball.z>BTN_H)return;
  const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=rr*rr||d2===0)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=rr-d,ia=1/a.m,ib=1/b.m,im=ia+ib;
  a.x-=nx*ov*ia/im;a.y-=ny*ov*ia/im;b.x+=nx*ov*ib/im;b.y+=ny*ov*ib/im;
  const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(vr<0){
    const before=ball?hyp(ball.vx,ball.vy):0;
    const e=ball?E_BALL:E_BB,j=-(1+e)*vr/im;a.vx-=j*ia*nx;a.vy-=j*ia*ny;b.vx+=j*ib*nx;b.vy+=j*ib*ny;
    if(ball){const sp=hyp(ball.vx,ball.vy);if(sp>LIFT_T&&sp-before>40&&ball.z<.5)ball.vz=Math.max(ball.vz,(sp-LIFT_T)*LIFT_K)}
    if(vr<-.5){
      Snd.hit(ball?'tick':'clack',-vr/330);
      if(ball)touchBall(ball===a?b:a);
      else{const m=G.move;if(m&&G.mode==='match'&&!m.moverTouched&&!m.foul&&a.side!==b.side&&(a===m.btn||b===m.btn)){m.foul=true;m.foulAt={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}
    }
  }
}
function pushOut(b,px,py,r,e){
  const dx=b.x-px,dy=b.y-py,d=hyp(dx,dy),rr=b.r+r;if(d>=rr||d===0)return 0;
  const nx=dx/d,ny=dy/d;b.x=px+nx*rr;b.y=py+ny*rr;const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn}return 0;
}
function segHit(b,s){const[ax,ay,bx,by]=s,vx=bx-ax,vy=by-ay;const t=clamp(((b.x-ax)*vx+(b.y-ay)*vy)/(vx*vx+vy*vy),0,1);const v=pushOut(b,ax+vx*t,ay+vy*t,0,E_NET);if(v>20)Snd.hit('net',v/250)}
function keeperLocal(k,x,y){const c=Math.cos(k.a),s=Math.sin(k.a),dx=x-k.x,dy=y-k.y;return {lx:dx*c+dy*s,ly:-dx*s+dy*c,c,s}}
function keeperDist(k,x,y){const {lx,ly}=keeperLocal(k,x,y);return hyp(lx-clamp(lx,-KW/2,KW/2),ly-clamp(ly,-KH/2,KH/2))}
function keeperHit(b,k,side){
  if(b.isBall&&b.z>KEEP_H)return;
  const {lx,ly,c,s}=keeperLocal(k,b.x,b.y),hx=KW/2,hy=KH/2;
  const qx=clamp(lx,-hx,hx),qy=clamp(ly,-hy,hy),ex=lx-qx,ey=ly-qy,d2=ex*ex+ey*ey;if(d2>=b.r*b.r)return;
  let nx,ny,d;
  if(d2<1e-8){const px=hx-Math.abs(lx),py=hy-Math.abs(ly);if(px<py){nx=Math.sign(lx)||1;ny=0;d=-px}else{nx=0;ny=Math.sign(ly)||1;d=-py}}
  else{d=Math.sqrt(d2);nx=ex/d;ny=ey/d}
  const wx=nx*c-ny*s,wy=nx*s+ny*c,ov=b.r-d;b.x+=wx*ov;b.y+=wy*ov;
  const vn=b.vx*wx+b.vy*wy;
  if(vn<0){b.vx-=(1+E_KEEP)*vn*wx;b.vy-=(1+E_KEEP)*vn*wy;if(vn<-.5)Snd.hit('keeper',-vn/330);if(b.isBall&&vn<-.5&&G.move&&G.ball.live)G.move.lastTouch=side}
}
function railHit(b,v){if(v>20)Snd.hit(b.isBall?'wood':'thud',v/320)}
function statics(b){
  if(b.x<b.r){b.x=b.r;if(b.vx<0){railHit(b,-b.vx);b.vx=-b.vx*E_RAIL}}if(b.x>TW-b.r){b.x=TW-b.r;if(b.vx>0){railHit(b,b.vx);b.vx=-b.vx*E_RAIL}}
  if(b.y<b.r){b.y=b.r;if(b.vy<0){railHit(b,-b.vy);b.vy=-b.vy*E_RAIL}}if(b.y>TH-b.r){b.y=TH-b.r;if(b.vy>0){railHit(b,b.vy);b.vy=-b.vy*E_RAIL}}
  if(!(b.isBall&&b.z>BAR)){for(const p of POSTS){const v=pushOut(b,p[0],p[1],POSTR,E_RAIL);if(v>20)Snd.hit('post',v/300)}for(const s of NETS)segHit(b,s)}
  keeperHit(b,G.keepers[0],0);keeperHit(b,G.keepers[1],1);
}
function checkBall(){
  const b=G.ball;let ev=null;const inMouth=Math.abs(b.x-CX)<GW/2;
  if(b.y<F.t-BALLR)ev=inMouth?(b.z>BAR?{type:'end',side:1,over:true}:{type:'goal',side:0}):{type:'end',side:1};
  else if(b.y>F.b+BALLR)ev=inMouth?(b.z>BAR?{type:'end',side:0,over:true}:{type:'goal',side:1}):{type:'end',side:0};
  else if(b.x<F.l-BALLR||b.x>F.r+BALLR)ev={type:'side'};
  if(ev){ev.x=b.x;ev.y=b.y;ev.z=b.z;G.event=ev;b.live=false;if(ev.type!=='goal'){b.vx=0;b.vy=0;b.z=0;b.vz=0}}
}
function step(dt){
  const all=bodies().concat([G.ball]);
  for(const b of all){
    const sp=hyp(b.vx,b.vy);
    if(sp>0){let ns;if(b.isBall&&b.z>0)ns=sp-sp*AIR_DRAG*dt;else ns=Math.max(0,sp-((b.isBall?A_BALL:A_BTN)+sp*DRAG)*dt);b.vx*=ns/sp;b.vy*=ns/sp}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin=(b.spin||0)+hyp(b.vx,b.vy)*dt/b.r*.35;
    if(b.isBall&&(b.z>0||b.vz>0)){b.vz-=GRAV*dt;b.z+=b.vz*dt;if(b.z<=0){b.z=0;if(b.vz<-40){Snd.hit('land',-b.vz/160);b.vz=-b.vz*BOUNCE}else b.vz=0}}
  }
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)collide(all[i],all[j]);
  for(const b of all)statics(b);
  if(G.event&&G.event.type==='goal'){
    // once in, the net holds the ball: no bounce back out, strong damping
    const b=G.ball,top=G.event.side===0,x0=CX-GW/2+BALLR,x1=CX+GW/2-BALLR,y0=top?F.t-GD+BALLR:F.b+BALLR,y1=top?F.t-BALLR:F.b+GD-BALLR;
    if(b.x<x0){b.x=x0;b.vx=Math.max(0,b.vx)*.2}if(b.x>x1){b.x=x1;b.vx=Math.min(0,b.vx)*.2}
    if(b.y<y0){b.y=y0;b.vy=Math.max(0,b.vy)*.2}if(b.y>y1){b.y=y1;b.vy=Math.min(0,b.vy)*.2}
    b.vx*=.985;b.vy*=.985;if(b.z>0){b.z=Math.min(b.z,BAR-.5)}
  }
  if(G.ball.live)checkBall();
}
function stopped(){const b=G.ball;return b.z===0&&b.vz===0&&bodies().concat([b]).every(o=>hyp(o.vx,o.vy)<1.5)}
function freeze(){for(const b of bodies().concat([G.ball])){b.vx=0;b.vy=0}G.ball.z=0;G.ball.vz=0}

/* ---------- positions ---------- */
const P=b=>b.tx!=null?{x:b.tx,y:b.ty}:{x:b.x,y:b.y};
function okSpot(x,y,skip,minBall){
  if(x<F.l-2||x>F.r+2||y<F.t+1||y>F.b-1)return false;
  for(const o of G.buttons)if(o!==skip){const p=P(o);if(hyp(p.x-x,p.y-y)<BR*2+.4)return false}
  if(hyp(G.ball.x-x,G.ball.y-y)<minBall)return false;
  for(const k of G.keepers)if(keeperDist(k,x,y)<BR+.4)return false;
  return true;
}
function nearestOk(x,y,skip,minBall){
  if(okSpot(x,y,skip,minBall))return {x,y};
  for(let r=2;r<40;r+=2)for(let a=0;a<12;a++){const px=x+Math.cos(a*PI/6)*r,py=y+Math.sin(a*PI/6)*r;if(okSpot(px,py,skip,minBall))return {x:px,y:py}}
  return {x,y};
}
function moveTo(b,p,anim){if(anim){b.tx=p.x;b.ty=p.y}else{b.x=p.x;b.y=p.y;b.tx=b.ty=null}}
function snapAll(){for(const b of G.buttons)if(b.tx!=null){b.x=b.tx;b.y=b.ty;b.tx=b.ty=null}}
function rescueButtons(){
  let moved=0;
  for(const b of G.buttons){
    if(b.y>=F.t-.5&&b.y<=F.b+.5)continue;
    const own=b.side===0?F.b:F.t,dir=b.side===0?-1:1;
    moveTo(b,nearestOk(CX+(rand()-.5)*30,own+dir*(PA.d+8),b,WALL),false);moved++;
  }
  if(moved)G.note=moved>1?tr('rescueN'):tr('rescue1');
}
function keeperHolds(){
  const b=G.ball;
  for(const side of [0,1]){const k=G.keepers[side],line=side===0?F.b:F.t;
    const inBox=Math.abs(b.x-CX)<SA.w/2&&(side===0?b.y>line-SA.d:b.y<line+SA.d);
    if(!inBox)continue;
    const behind=Math.abs(b.x-CX)<GW/2+BR&&(side===0?b.y>k.y:b.y<k.y);
    if(behind||keeperDist(k,b.x,b.y)<BALLR+.8)return side;}
  return -1;
}

/* ---------- resolving a move ---------- */
function proceed(fn){if(G.timeUp)endHalf();else fn()}
function resolve(){
  freeze();Snd.slide(0,0);G.phase='pause';const m=G.move,ev=G.event;
  if(G.mode==='pens')return resolvePen();
  const mover=m.side;
  if(m.lastTouch!=null||m.moverTouched)G.koTouches=(G.koTouches||0)+1;
  rescueButtons();
  if(m.foul){
    // free kick where the buttons touched; inside the box the fouled side attacks, a penalty
    const opp=1-mover,fp=m.foulAt||m.ballStart;Snd.whistle(false);
    const gy=opp===0?F.t:F.b,inBox=Math.abs(fp.x-CX)<PA.w/2&&(opp===0?fp.y<F.t+PA.d:fp.y>F.b-PA.d);
    if(inBox){banner(tr('penalty'),opp===0?tr('penFor'):tr('penForCpu',{c:cpuC()}),1500,()=>proceed(()=>penaltyKick(opp)));return}
    Object.assign(G.ball,newBall(clamp(fp.x,F.l+BALLR+.5,F.r-BALLR-.5),clamp(fp.y,F.t+BALLR+.5,F.b-BALLR-.5)));
    banner(tr('foul'),opp===0?tr('foulYou'):tr('foulCpu',{c:cpuC()}),1300,()=>proceed(()=>setPiece('free',opp,null,tr('freeMsg'))));return;
  }
  if(ev&&ev.type==='goal'){
    const sc=ev.side;
    if(sc!==mover)return goalFor(sc,tr('own'),false);
    if(m.announced){if(m.pen&&sc===0){prefs.stats.pens++;save()}return goalFor(sc,null,ev.z>.4)}
    Snd.whistle(false);
    banner(tr('noGoal'),tr('noGoalSub'),1700,()=>proceed(()=>setPiece('goalkick',1-sc,ev,'')));return;
  }
  if(ev&&ev.type==='side'){const t=(m.announced||m.lastTouch==null)?1-mover:1-m.lastTouch;return proceed(()=>setPiece('throw',t,ev,tr('throwMsg')))}
  if(ev&&ev.type==='end'){const def=ev.side,lt=m.announced?mover:(m.lastTouch==null?mover:m.lastTouch);
    if(ev.over)return proceed(()=>setPiece('goalkick',def,ev,tr('overMsg')));
    return proceed(()=>lt===def?setPiece('corner',1-def,ev,tr('cornerMsg')):setPiece('goalkick',def,ev,tr('goalkickMsg')))}
  const kh=keeperHolds();
  if(kh>=0)return proceed(()=>setPiece('goalkick',kh,{x:G.ball.x},tr('keeperMsg')));
  let next,msg='';
  if(m.announced){next=1-mover;msg=mover===0?tr('shotMissYou'):tr('shotMissCpu')}
  else if(!m.moverTouched){next=1-mover;msg=mover===0?tr('missYou'):tr('missCpu')}

function goalFor(sc,label,lob){

  const t=TEAMS[G.teams[sc]];
  banner(tr('goal'),`${label?label+' · ':''}${tn(t)} · ${G.score[0]}–${G.score[1]}`,2100,()=>{if(G.score[sc]>=GOALS_TO_WIN)finishMatch();else kickoff(1-sc,false)});
}

/* ---------- penalty during the match ---------- */
function penaltyKick(side){
  G.koTouches=Math.max(2,G.koTouches||0);
  G.lock=null;G.pendingLock=true;G.penKick=true;
  const gy=side===0?F.t:F.b,dir=side===0?1:-1;
  G.ball=newBall(CX,gy+dir*SPOT);
  let taker=null,bd=1e9;for(const o of G.buttons)if(o.side===side){const d=hyp(o.x-G.ball.x,o.y-G.ball.y);if(d<bd){bd=d;taker=o}}
  moveTo(taker,{x:CX,y:G.ball.y+dir*(BR+BALLR+3)},false);
  // everyone else leaves the box and the arc
  const edge=gy+dir*(PA.d+BR+1.5);
  for(const o of G.buttons){if(o===taker)continue;
    const inBox=Math.abs(o.x-CX)<PA.w/2+BR&&(side===0?o.y<edge:o.y>edge);
    if(inBox||hyp(o.x-G.ball.x,o.y-G.ball.y)<RING+1)moveTo(o,nearestOk(clamp(o.x,F.l+BR,F.r-BR),edge+dir*2,o,RING+1),false)}
  for(let it=0;it<3;it++)for(const o of G.buttons){if(o===taker)continue;const inBox=Math.abs(o.x-CX)<PA.w/2+BR&&(side===0?o.y<edge:o.y>edge);if(inBox)moveTo(o,nearestOk(o.x,edge+dir*(4+it*6),o,RING+1),false)}
  G.keepers[1-side]=homeKeeper(1-side);G.kt=[null,null];
  G.turn=side;G.announced=true;G.event=null;G.move=null;G.cam.manual=false;
  if(side===0){
    const r=rand(),off=(GW/2-KW/2-.4)*(.5+rand()*.6);
    G.kt[1]={x:CX+(r<.38?-off:r<.76?off:0),y:G.keepers[1].y,a:gauss()*.15};
    G.phase='aim';setStatus(tr('penYou'));
  }else{G.phase='keeperSet';setStatus(tr('penCpu',{c:cpuC()}))}
  hud();
}

/* ---------- dead-ball set pieces ---------- */
function setPiece(kind,side,ev,msg){
  const b=G.ball;Object.assign(b,newBall(b.x,b.y));let bx=b.x,by=b.y,tx,ty;
  const atkY=side===0?F.t:F.b, dirY=side===0?-1:1;
  if(kind==='throw'){bx=ev.x<CX?F.l+BALLR+.2:F.r-BALLR-.2;by=clamp(ev.y,F.t+6,F.b-6);tx=CX;ty=by+dirY*25}
  else if(kind==='corner'){
    // defender touched it last: corner from the flag on the side it went out
    const def=1-side,line=def===0?F.b:F.t,inward=def===0?-1:1;
    by=line+inward*(BALLR+.4);bx=(ev&&ev.x<CX)?F.l+BALLR+.4:F.r-BALLR-.4;tx=CX;ty=line+inward*SPOT}
  else if(kind==='goalkick'){
    // attacker touched it last (or it went over the bar): goal kick from the nearest small-box corner
    const line=side===0?F.b:F.t,inward=side===0?-1:1;
    bx=CX+((ev&&ev.x<CX)?-1:1)*SA.w/2;by=line+inward*SA.d;tx=CX+(bx<CX?-20:20);ty=atkY}
  else{tx=CX;ty=atkY}
  b.x=bx;b.y=by;
  const dl=hyp(tx-bx,ty-by),ux=(tx-bx)/dl,uy=(ty-by)/dl,gap=BR+BALLR+1.8;
  const px=clamp(bx-ux*gap,BR,TW-BR),py=clamp(by-uy*gap,BR,TH-BR);
  let taker=null,bd=1e9;for(const o of G.buttons)if(o.side===side){const d=hyp(o.x-px,o.y-py);if(d<bd){bd=d;taker=o}}
  moveTo(taker,{x:px,y:py},false);
  // every opponent leaves the ring; teammates only step off the ball
  for(const o of G.buttons){if(o===taker)continue;const R=o.side!==side?RING+.6:BR+BALLR+1,d=hyp(o.x-bx,o.y-by);
    if(d<R){const k=d||1;moveTo(o,nearestOk(bx+(o.x-bx)/k*R,by+(o.y-by)/k*R,o,R),false)}}
  G.sp={kind,side,taker,msg};G.lock=null;G.pendingLock=true;G.cam.manual=false;
  if(side===1)startSetup(false);
  else{G.phase='pause';setStatus(tr('cpuRepo',{c:cpuC()}));hud();cpuSetup(false);later(()=>{snapAll();setupTaker()},750)}
}
function setupTaker(){
  const sp=G.sp;
  if(sp.side===0)startSetup(true);
  else{G.phase='pause';setStatus(tr('cpuPrep',{c:cpuC()}));hud();cpuSetup(true);later(()=>{snapAll();beginTurn(1,sp.msg)},750)}
}
function startSetup(taking){G.phase='setup';G.turn=G.sp.side;G.setup={taking,moved:[]};hud();setupStatus()}
function setupStatus(extra){
  const s=G.setup,n=MAX_MOVE-s.moved.length,K=STR[prefs.lang].kind[G.sp.kind];
  setStatus((s.taking?tr('setupTake',{k:prefs.lang==='en'?K.toLowerCase():K,n}):tr('setupDef',{n}))+(extra?' '+extra:''));
}
function cpuSetup(taking){
  const ball=G.ball,mine=G.buttons.filter(b=>b.side===1),opp=G.buttons.filter(b=>b.side===0);
  const own={x:CX,y:F.t};
  if(taking){
    const sp=G.sp,dg=hyp(ball.x-CX,ball.y-F.b);
    const T=dg<80?{x:CX+(rand()<.5?-1:1)*(GW/2-3),y:F.b}:{x:ball.x+(CX-ball.x)*.4,y:Math.min(F.b-20,ball.y+45)};
    const d=hyp(T.x-ball.x,T.y-ball.y)||1;
    moveTo(sp.taker,nearestOk(ball.x-(T.x-ball.x)/d*(BR+BALLR+1.6),ball.y-(T.y-ball.y)/d*(BR+BALLR+1.6),sp.taker,BR+BALLR+.3),true);
    const spots=[];
    for(let i=-3;i<=3;i++)for(let j=1;j<=4;j++){const x=CX+i*14,y=clamp(ball.y+j*14,F.t+10,F.b-12);
      let mo=1e9;for(const o of opp)mo=Math.min(mo,hyp(o.x-x,o.y-y));
      spots.push({x,y,s:Math.min(mo,16)-hyp(x-CX,y-(F.b-24))*.12-Math.abs(hyp(x-ball.x,y-ball.y)-35)*.15})}
    spots.sort((a,b)=>b.s-a.s);
    const movers=mine.filter(b=>b!==sp.taker&&b.y>F.t+40).sort((a,b)=>hyp(b.x-ball.x,b.y-ball.y)-hyp(a.x-ball.x,a.y-ball.y)).slice(0,MAX_MOVE-1);
    let k=0;for(const b of movers){while(k<spots.length&&!okSpot(spots[k].x,spots[k].y,b,WALL))k++;if(k<spots.length){moveTo(b,spots[k],true);k++}}
  }else{
    const d=hyp(own.x-ball.x,own.y-ball.y)||1;
    const wall={x:ball.x+(own.x-ball.x)/d*(RING+1),y:ball.y+(own.y-ball.y)/d*(RING+1)};
    let danger=null,dd=1e9;for(const o of opp){if(G.sp&&o===G.sp.taker)continue;const e=hyp(o.x-own.x,o.y-own.y);if(e<dd){dd=e;danger=o}}
    // a wall, then mark the most dangerous attackers goal-side
    const targets=[wall];
    const threats=opp.filter(o=>!(G.sp&&o===G.sp.taker)).sort((a,b)=>hyp(a.x-own.x,a.y-own.y)-hyp(b.x-own.x,b.y-own.y)).slice(0,MAX_MOVE-1);
    for(const o of threats){const e=hyp(own.x-o.x,own.y-o.y)||1;targets.push({x:o.x+(own.x-o.x)/e*(BR*2+1),y:o.y+(own.y-o.y)/e*(BR*2+1)})}
    const used=new Set();
    for(const t of targets){let best=null,bd=1e9;for(const b of mine){if(used.has(b))continue;const e=hyp(b.x-t.x,b.y-t.y);if(e<bd){bd=e;best=b}}
      if(best){used.add(best);moveTo(best,nearestOk(t.x,t.y,best,RING+.6),true)}}
  }
}
function endHalf(){
  G.phase='pause';G.timeUp=false;G.aim=null;G.kdrag=null;G.sdrag=null;Snd.tension(0);Snd.whistle(true);
  if(G.half===1)banner(tr('halfTime'),`${TEAMS[G.teams[0]].c} ${G.score[0]}–${G.score[1]} ${TEAMS[G.teams[1]].c}`,2200,()=>{G.half=2;G.clock=G.halfLen;hud();kickoff(1-G.kickFirst,true)});
  else if(G.score[0]!==G.score[1])finishMatch();
  else banner(tr('pens'),tr('pensSub'),2200,startPens);
}

/* ---------- penalties ---------- */
function startPens(){G.mode='pens';G.pens={k:[[],[]],shooter:rand()<.5?0:1};$('#pens').hidden=false;hud();nextPen()}
function nextPen(){
  const s=G.pens.shooter,dirY=s===0?-1:1;
  G.ball=newBall(CX,s===0?F.t+SPOT:F.b-SPOT);
  G.pkBtn={x:CX,y:G.ball.y-dirY*(BR+BALLR+3),vx:0,vy:0,r:BR,m:3,side:s,num:10};
  G.keepers=[homeKeeper(0),homeKeeper(1)];G.kt=[null,null];
  G.turn=s;G.announced=true;G.event=null;G.move=null;G.cam.manual=false;
  if(s===0){
    const r=rand(),off=(GW/2-KW/2-.4)*(.5+rand()*.6);
    G.kt[1]={x:CX+(r<.38?-off:r<.76?off:0),y:G.keepers[1].y,a:gauss()*.15};
    G.phase='aim';setStatus(tr('penYou'));
  }else{G.phase='keeperSet';setStatus(tr('penCpu',{c:cpuC()}))}
  hud();
}
function resolvePen(){
  const s=G.pens.shooter,ev=G.event,scored=!!(ev&&ev.type==='goal'&&ev.side===s),over=!!(ev&&ev.over);
  G.pens.k[s].push(scored?1:0);hud();
  banner(scored?tr('penGoal'):over?tr('penOver'):tr('penSaved'),s===0?(scored?tr('youScore'):tr('youMiss')):(scored?tr('cpuScore'):tr('cpuMiss')),1300,()=>{
    if(pensDecided())finishMatch();else{G.pens.shooter=1-s;nextPen()}});
}
function pensDecided(){
  const [a,b]=G.pens.k,ga=a.reduce((x,y)=>x+y,0),gb=b.reduce((x,y)=>x+y,0),na=a.length,nb=b.length;
  if(na<=5&&nb<=5){if(ga+(5-na)<gb||gb+(5-nb)<ga)return true;if(na===5&&nb===5)return ga!==gb;return false}
  return na===nb&&ga!==gb;
}
function finishMatch(){
  G.phase='over';Snd.whistle(true);
  let win,p=null;
  if(G.mode==='pens'){const s=G.pens.k.map(k=>k.reduce((x,y)=>x+y,0));p=s;win=s[0]>s[1]}else win=G.score[0]>G.score[1];
  const st=prefs.stats;
  if(win){st.wins++;if(T.diff==='hard')st.hard++}
  if(G.score[1]===0)st.clean++;
  if(G.hat>=3)st.hat++;
  save();
  const res={s:G.score.slice(),p,win};
  const t=TEAMS[G.teams[win?0:1]];
  const sub=`${TEAMS[G.teams[0]].c} ${G.score[0]}–${G.score[1]} ${TEAMS[G.teams[1]].c}${p?' · '+tr('pensShort',{a:p[0],b:p[1]}):''}`;
  setStatus(tr('fullTime'));hud();
  bannerBtn(win?tr('win'):tr('lose'),tr('through',{t:tn(t),sub}),()=>{recordUser(res);G=null;show('bracket');renderBracket()});
}

/* ---------- CPU ---------- */
function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy;const t=l?clamp(((px-ax)*vx+(py-ay)*vy)/l,0,1):0;return [hyp(px-ax-vx*t,py-ay-vy*t),t]}
function evalFlick(b,T,D,lob){
  const ball=G.ball,dx=T.x-ball.x,dy=T.y-ball.y,dl=hyp(dx,dy);if(dl<.1)return null;
  const ddx=dx/dl,ddy=dy/dl,cx=ball.x-ddx*(BR+BALLR),cy=ball.y-ddy*(BR+BALLR);
  const sx=cx-b.x,sy=cy-b.y,s=hyp(sx,sy);if(s<.4)return null;
  const ux=sx/s,uy=sy/s,cos=ux*ddx+uy*ddy;if(cos<.45)return null;
  const [bd,bt]=segDist(ball.x,ball.y,b.x,b.y,cx,cy);if(bd<BR+BALLR-.1&&bt<.97)return null;
  let block=0,foul=0;for(const o of bodies())if(o!==b&&segDist(o.x,o.y,b.x,b.y,cx,cy)[0]<BR*2-.3){block++;if(o.side!==b.side)foul++}
  for(const k of G.keepers){const [kd]=segDist(k.x,k.y,b.x,b.y,cx,cy);if(kd<BR+KW/2-1)block++}
  const vb=lob?495:Math.min(LIFT_T-15,Math.sqrt(2*A_BALL*1.5*D)),vc=vb/(1.41*cos);
  let v0=Math.sqrt(vc*vc+2*A_BTN*1.4*s),weak=false;if(v0>VMAX){v0=VMAX;weak=true}
  return {b,ux,uy,v0,s,cos,score:25*cos-.22*s-30*block-40*foul-(weak?12:0)};
}
function keeperShadow(k,bx,by,gy){
  const c=Math.cos(k.a),s=Math.sin(k.a),xs=[];
  for(const [u,v] of [[-1,-1],[1,-1],[1,1],[-1,1]]){const ex=k.x+c*u*KW/2-s*v*KH/2,ey=k.y+s*u*KW/2+c*v*KH/2;
    if(Math.abs(ey-by)<.5)continue;xs.push(bx+(ex-bx)*(gy-by)/(ey-by))}
  return xs.length?[Math.min(...xs),Math.max(...xs)]:[CX,CX];
}
function cpuPlan(side,forceShot){
  const ball=G.ball,dirY=side===1?1:-1,gy=side===1?F.b:F.t,mine=bodies().filter(b=>b.side===side&&!(G.lock&&G.lock.side===side&&G.lock.b===b)),opp=bodies().filter(b=>b.side!==side);
  const distGoal=hyp(ball.x-CX,ball.y-gy);
  let bestPass=null,bestShot=null;
  const lo=CX-GW/2+BALLR+.8,hi=CX+GW/2-BALLR-.8;let tx=[],lob=false;
  if(forceShot||G.mode==='pens'){
    const [kl,kr]=keeperShadow(G.keepers[1-side],ball.x,ball.y,gy),gl=kl-BALLR-lo,gr=hi-(kr+BALLR);
    if(gl>0)tx.push({x:(lo+kl-BALLR)/2,w:gl});if(gr>0)tx.push({x:(kr+BALLR+hi)/2,w:gr});
    tx.sort((a,b)=>b.w-a.w);
    lob=(!tx.length||tx[0].w<2)&&distGoal>45&&distGoal<120&&G.mode==='match';
    tx=tx.map(t=>t.x);if(!tx.length||lob)tx=[CX+gauss()*3];
  }else tx=[lo+2,hi-2];
  for(const x of tx){const Tg={x,y:gy+dirY*2};let lane=0;
    if(!lob)for(const o of opp)if(segDist(o.x,o.y,ball.x,ball.y,Tg.x,Tg.y)[0]<BR+BALLR+.2)lane++;
    for(const b of mine){const f=evalFlick(b,Tg,hyp(Tg.x-ball.x,Tg.y-ball.y)+25,lob);if(!f)continue;
      f.total=45-(distGoal-25)*.45+f.score-35*lane;f.shot=true;if(!bestShot||f.total>bestShot.total)bestShot=f}}
  if(forceShot&&bestShot)return bestShot;
  if(G.mode==='match'&&(G.koTouches||0)<2)bestShot=null; // no shots straight from kick-off
  const base=Math.atan2(gy-ball.y,CX-ball.x);
  for(const a of [-110,-80,-55,-30,-12,0,12,30,55,80,110])for(const L of [16,30,46]){
    const ang=base+a*PI/180,Tp={x:ball.x+Math.cos(ang)*L,y:ball.y+Math.sin(ang)*L};
    let ts=(Tp.y-ball.y)*dirY*.55;
    if(Tp.x<F.l+3||Tp.x>F.r-3)ts-=40; if(Tp.y<F.t+2||Tp.y>F.b-2)ts-=40;
    for(const o of opp)if(segDist(o.x,o.y,ball.x,ball.y,Tp.x,Tp.y)[0]<BR+BALLR+.3)ts-=22;
    let dn=1e9;for(const o of mine)dn=Math.min(dn,hyp(o.x-Tp.x,o.y-Tp.y));ts+=Math.max(0,18-dn)*.7;
    ts+=Math.max(0,70-hyp(Tp.x-CX,Tp.y-gy))*.25;
    const ownY=side===1?F.t:F.b,dOwn=hyp(Tp.x-CX,Tp.y-ownY);if(dOwn<35)ts-=(35-dOwn)*.8;
    for(const b of mine){const f=evalFlick(b,Tp,L+3,false);if(!f)continue;f.total=ts+f.score;if(!bestPass||f.total>bestPass.total)bestPass=f}}
  if(bestShot&&distGoal<75&&(!bestPass||bestShot.total>bestPass.total+4))return bestShot;
  if(bestPass)return bestPass;
  if(bestShot)return bestShot;
  let nb=null,nd=1e9;for(const b of mine){const d=hyp(b.x-ball.x,b.y-ball.y);if(d<nd){nd=d;nb=b}}
  const ux=(ball.x-nb.x)/nd,uy=(ball.y-nb.y)/nd;return {b:nb,ux,uy,v0:Math.min(VMAX,120+nd*3),s:nd,cos:1,score:0};
}
function cpuTurn(){
  if(G.phase!=='cpuThink'||G.turn!==1)return;
  const plan=cpuPlan(1,false);
  if(plan.shot){G.announced=true;G.phase='keeperSet';setStatus(tr('cpuAnnounce'));hud()}
  else execPlan(plan);
}
function execPlan(p){
  const sk=G.skill,sig=.012+(1-sk)*.05+p.s*.0006,a=Math.atan2(p.uy,p.ux)+gauss()*sig;
  const v=clamp(p.v0*(1+gauss()*(.04+(1-sk)*.1)),VMIN,VMAX);
  G.phase='cpuAim';G.cpuAim={b:p.b,ux:Math.cos(a),uy:Math.sin(a),pw:0,tpw:pwOf(v)};hud();Snd.hit('press',.5);
  later(()=>flick(p.b,Math.cos(a)*v,Math.sin(a)*v),650);
}
function faceBall(side){
  const b=G.ball,gx=CX,gy=side===0?F.b:F.t,dx=b.x-gx,dy=b.y-gy,d=hyp(dx,dy)||1,ux=dx/d,uy=dy/d;
  const dist=KH/2+1+(d<45?2.5:0);

  return clampK(side,{x:gx+ux*dist+gauss()*(1-G.skill)*3,y:gy+uy*dist,a:a+gauss()*(1-G.skill)*.25});
}
function clampK(side,p){
  const xr=GW/2+2;
  const y=side===0?clamp(p.y,F.b-SA.d+KH/2,F.b-KH/2-.2):clamp(p.y,F.t+KH/2+.2,F.t+SA.d-KH/2);
  return {x:clamp(p.x,CX-xr,CX+xr),y,a:clamp(p.a||0,-1.3,1.3)};
}

/* ---------- camera ---------- */
function camClamp(x,y){
  const hw=CW/(2*S),hh=CH/(2*S),m=4;
  return {x:hw*2>=TW+2*m?TW/2:clamp(x,hw-m,TW-hw+m),y:hh*2>=TH+2*m?TH/2:clamp(y,hh-m,TH-hh+m)};
}
function camTarget(){
  const c=G.cam;if(c.manual)return {x:c.x,y:c.y};

function drawKeeper(c,k,team,edit,pulse){

  c.fillStyle='rgba(0,0,0,.28)';c.save();c.translate(L.x*.9+.15,L.y*.9+.7);c.rotate(k.a);rr(c,-KW/2,-KH/2,KW,KH,.6);c.fill();c.restore();

  c.rotate(k.a);

  rr(c,-KW/2,-KH/2,KW,KH,.6);c.fillStyle=g;c.fill();c.lineWidth=.22;c.strokeStyle=team.ring;c.stroke();
  c.fillStyle=team.ring;c.fillRect(-.45,-KH/2+.3,.9,KH-.6);
  c.fillStyle='rgba(255,255,255,.3)';c.fillRect(-KW/2+.6,-KH/2+.25,KW-1.2,.22);

    c.strokeStyle=`rgba(255,210,63,${.5+.5*pulse})`;c.lineWidth=.22;c.setLineDash([.7,.5]);rr(c,-KW/2-.9,-KH/2-.9,KW+1.8,KH+1.8,1.1);c.stroke();c.setLineDash([]);

  }

/* where the ball would go if released now: button path to first contact, then the ball alone */
function predictBall(b,ang,pw,seed,ts){
  const lvl=AIM[aimLevel()-1],v0=vOf(pw),ux=Math.cos(ang),uy=Math.sin(ang),ball=G.ball,R=BR+BALLR;
  const fx=b.x-ball.x,fy=b.y-ball.y,q=fx*ux+fy*uy,d=q*q-(fx*fx+fy*fy-R*R);if(d<0)return null;
  const sHit=-q-Math.sqrt(d);if(sHit<0)return null;

  const sp=1.41*vn,a2=Math.atan2(ny,nx)+lvl.err*Math.sin(ts/900+seed);
  let x=ball.x,y=ball.y,vx=Math.cos(a2)*sp,vy=Math.sin(a2)*sp,z=0,vz=sp>LIFT_T?(sp-LIFT_T)*LIFT_K:0,len=0;
  const pts=[[x,y,0]],dt=1/120;
  for(let i=0;i<480;i++){
    const spd=hyp(vx,vy);if(spd<2&&z===0)break;
    const ns=z>0?spd-spd*AIR_DRAG*dt:Math.max(0,spd-(A_BALL+spd*DRAG)*dt);vx*=ns/spd;vy*=ns/spd;

}
function drawPrediction(c,pts){
  const n=pts.length;c.lineCap='round';
  for(let i=1;i<n;i++){const [x0,y0,z0]=pts[i-1],[x1,y1]=pts[i],t=i/n;
    c.strokeStyle=`rgba(255,255,255,${.55*(1-t)+.08})`;c.lineWidth=.32;
    if(z0>BTN_H){c.setLineDash([.6,.7])}else c.setLineDash([]);
    c.beginPath();c.moveTo(x0,y0-z0*.9);c.lineTo(x1,y1-pts[i][2]*.9);c.stroke()}
  c.setLineDash([]);const [ex,ey,ez]=pts[n-1];
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=.2;c.beginPath();c.arc(ex,ey-ez*.9,BALLR,0,2*PI);c.stroke();
}
const powerColor=pw=>pw<LIFT_P?'#ffffff':pw<HIGH_P?'#ffd23f':'#ff5a3d';
function drawAim(c,b,ang,pw,finger,skin){
  const ux=Math.cos(ang),uy=Math.sin(ang),col=powerColor(pw),L=5+pw*22,d=b.r+PAL_R*.7+pw*7;
  if(finger){c.setLineDash([.7,.8]);c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=.22;c.beginPath();c.moveTo(b.x-ux*d,b.y-uy*d);c.lineTo(finger.x,finger.y);c.stroke();c.setLineDash([])}

  const ex=b.x+ux*(b.r+L),ey=b.y+uy*(b.r+L);
  c.beginPath();c.moveTo(b.x+ux*(b.r+.5),b.y+uy*(b.r+.5));c.lineTo(ex,ey);c.stroke();
  c.fillStyle=col;c.beginPath();c.moveTo(ex+ux*2,ey+uy*2);c.lineTo(ex-uy*1.2,ey+ux*1.2);c.lineTo(ex+uy*1.2,ey-ux*1.2);c.closePath();c.fill();
  drawPalheta(c,b.x-ux*d,b.y-uy*d,PAL_R,skin,ang);
  const mx=b.x+uy*(b.r+2.4)-.6,my=b.y-ux*(b.r+2.4)-4.5;

  c.fillStyle=col;rr(c,mx,my+9*(1-pw),1.2,Math.max(.5,9*pw),.5);c.fill();
  c.fillStyle='rgba(255,255,255,.85)';c.fillRect(mx-.25,my+9*(1-LIFT_P)-.08,1.7,.16);c.fillRect(mx-.25,my+9*(1-HIGH_P)-.08,1.7,.16);
  c.fillStyle=col;c.font='600 1.5px "Geist Mono", monospace';c.textAlign='center';c.textBaseline='bottom';c.fillText(Math.round(pw*100),mx+.6,my-.4);
}
function render(ts){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle=stageBg;c.fillRect(0,0,CW,CH);
  c.setTransform(S*DPR,0,0,S*DPR,(CW/2-G.cam.x*S)*DPR,(CH/2-G.cam.y*S)*DPR);
  drawTable(c);
  const tA=TEAMS[G.teams[0]],tB=TEAMS[G.teams[1]],pulse=.5+.5*Math.sin(ts/260),bl=G.ball;
  if(G.phase==='setup'){
    c.fillStyle='rgba(255,255,255,.1)';c.beginPath();c.arc(bl.x,bl.y,RING,0,2*PI);c.fill();

    if(G.phase==='setup'&&b.side===0){const s=G.setup;
      if(b===G.sp.taker){if(s.taking)glow=`rgba(255,210,63,${.5+.5*pulse})`}
      else if(s.moved.includes(b))glow='rgba(255,255,255,.9)';
      else if(s.moved.length<MAX_MOVE)glow=`rgba(255,255,255,${.15+.25*pulse})`;}
    drawButton(c,b,team,glow);
    if(G.lock&&G.lock.b===b&&G.mode==='match'&&G.phase!=='moving'){c.strokeStyle='rgba(255,90,61,.75)';c.lineWidth=.3;c.setLineDash([.6,.6]);c.beginPath();c.arc(b.x,b.y,b.r+.8,0,2*PI);c.stroke();c.setLineDash([])}
  }

  c.strokeStyle='rgba(255,255,255,.32)';c.lineWidth=.12;c.beginPath();c.arc(bl.x,by,br*.66,PI*1.1,PI*1.6);c.stroke();
  if(z>BTN_H){c.strokeStyle=`rgba(255,210,63,${Math.min(.8,z*.12)})`;c.lineWidth=.18;c.beginPath();c.arc(bl.x,by,br+.45,0,2*PI);c.stroke()}

    // inside the cancel zone: letting go here does nothing
    const b=G.aim.b;c.strokeStyle='rgba(255,120,100,.85)';c.lineWidth=.3;c.setLineDash([.7,.6]);c.beginPath();c.arc(b.x,b.y,b.r+1.6,0,2*PI);c.stroke();c.setLineDash([]);
    c.lineWidth=.45;const k=1.1,cx=b.x+b.r+2.6,cy=b.y-b.r-1.6;c.beginPath();c.moveTo(cx-k,cy-k);c.lineTo(cx+k,cy+k);c.moveTo(cx+k,cy-k);c.lineTo(cx-k,cy+k);c.stroke()}
  if(G.aim&&G.aim.pw>.005&&G.aim.raw>=CANCEL_PX){const pr=predictBall(G.aim.b,G.aim.ang,G.aim.pw,G.aim.seed,ts);if(pr)drawPrediction(c,pr);
    drawAim(c,G.aim.b,G.aim.ang,G.aim.pw,{x:G.aim.fx,y:G.aim.fy},skinById(prefs.skin))}
  if(G.cpuAim){const a=G.cpuAim;drawAim(c,a.b,Math.atan2(a.uy,a.ux),a.pw,null,SKINS[0])}

    const top=G.turn===0;c.strokeStyle=`rgba(255,210,63,${.4+.5*pulse})`;c.lineWidth=.5;c.strokeRect(CX-GW/2-.6,top?F.t-GD-.6:F.b-.6,GW+1.2,GD+1.2);
